plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esilva.equiposunidos'
    compileSdk 34

    defaultConfig {
        applicationId "com.esilva.equiposunidos"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.01.05"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    // Nombre de salida: ComerciosRedeban_<BuildType><FLAVOR><Version>.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName.replace('.', '_')
            outputFileName = "EquiposUnidos_V_${versionName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'org.apache.poi:poi:5.2.4'
    implementation('org.apache.poi:poi-ooxml:5.2.4') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation 'org.apache.xmlbeans:xmlbeans:3.1.0'
    implementation 'stax:stax-api:1.0.1'

    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'com.airbnb.android:lottie:6.1.0'


    implementation project(path: ':libBioMini')
    implementation 'androidx.appcompat:appcompat:1.6.1'

    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Necesario para integrar Futures en Java
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    implementation "com.google.guava:guava:31.1-android"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
}